name: Build foo_livelyric Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WTL
        run: |
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/wtl/files/WTL%2010/WTL%2010.0.10320%20Release/WTL10.0.10320%20Release.zip/download" -OutFile "$env:RUNNER_TEMP\wtl.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wtl.zip" -DestinationPath "$env:RUNNER_TEMP\wtl"
          echo "WTL_INCLUDE=$env:RUNNER_TEMP\wtl\Include" >> $env:GITHUB_ENV

      - name: Build plugin
        run: |
          $env:INCLUDE = "$env:WTL_INCLUDE;$env:INCLUDE"
          msbuild fb2k_sdk\foobar2000\foo_sample\foo_sample.sln `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /p:PlatformToolset=v143 `
            /t:Build `
            /m `
            /verbosity:minimal

      - name: Verify output
        run: |
          if (Test-Path "fb2k_sdk\foobar2000\foo_sample\Release\foo_livelyric.dll") {
            Write-Host "BUILD SUCCESS: foo_livelyric.dll generated"
            Get-Item "fb2k_sdk\foobar2000\foo_sample\Release\foo_livelyric.dll" | Format-List Name, Length, LastWriteTime
          } else {
            Write-Error "BUILD FAILED: foo_livelyric.dll not found"
            Get-ChildItem "fb2k_sdk\foobar2000\foo_sample\Release\" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_livelyric
          path: fb2k_sdk\foobar2000\foo_sample\Release\foo_livelyric.dll
          if-no-files-found: error
