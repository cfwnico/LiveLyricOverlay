name: Build foo_livelyric Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build plugin
        shell: pwsh
        run: |
          msbuild fb2k_sdk_2025\foobar2000\foo_sample\foo_sample.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /t:Build `
            /m `
            /verbosity:minimal

      - name: Verify output
        shell: pwsh
        run: |
          $dll = "fb2k_sdk_2025\foobar2000\foo_sample\x64\Release\foo_livelyric.dll"
          if (Test-Path $dll) {
            Write-Host "BUILD SUCCESS: foo_livelyric.dll generated"
            Get-Item $dll | Format-List Name, Length, LastWriteTime
          } else {
            Write-Error "BUILD FAILED: foo_livelyric.dll not found"
            Get-ChildItem "fb2k_sdk_2025\foobar2000\foo_sample\" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_livelyric
          path: fb2k_sdk_2025\foobar2000\foo_sample\x64\Release\foo_livelyric.dll
          if-no-files-found: error
